  <body>
    <h1>Palacsintarecept</h1>
    <h2>Hozzávalók</h2>
    <p>20 dkg liszt</p><p>2 tojás</p><p>3 dl tej</p><p>2 dl szódavíz</p>
    <h2>Elkészítés</h2>
    <p>Keverd össze az alapanyagokat.</p><p>Pihentesd a tésztát.</p><p>Forrósítsd fel a serpenyőt.</p><p>Süsd meg a palacsintákat.</p>
