<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Python - 1. hét/title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
  </head>

  <body>
    <div class="container py-5">
      <div class="mb-4">
        <a href="../index.html" class="btn btn-secondary btn-lg">Vissza </a>
      </div>
      <h1 class="text-center mb-4">Python - Bevezetés</h1>

      <p class="lead text-center mb-5">
        Ebben a leckében megismerkedünk a Python alapvető adattípusaival,
        műveleteivel, változóival és a kiíratással.
      </p>

      <!-- 1. KIÍRATÁS -->

      <h2 class="mt-5">1. Kiíratás a print() függvénnyel</h2>

      <p>
        A Pythonban a <code>print()</code> függvénnyel tudunk adatokat
        megjeleníteni a képernyőn.
      </p>

      <pre class="bg-light p-3 rounded"><code>print("Hello World!")</code></pre>

      <p>A program futtatásakor az alábbi eredményt kapjuk:</p>

      <pre
        class="bg-dark text-light p-3 rounded"
      ><code>Hello World!</code></pre>

      <!-- 2. SZTRINGEK -->

      <h2 class="mt-5">2. Sztringek</h2>

      <p>
        A sztring szöveges adatot jelent. Pythonban idézőjelek között adjuk meg.
      </p>

      <pre class="bg-light p-3 rounded"><code>print("Hello")
print("Python")</code></pre>

      <h3 class="mt-4">Sztringek összefűzése</h3>

      <pre
        class="bg-light p-3 rounded"
      ><code>print("Hello" + " " + "World!")</code></pre>

      <p>Eredmény:</p>

      <pre
        class="bg-dark text-light p-3 rounded"
      ><code>Hello World!</code></pre>

      <h3 class="mt-4">Sztring ismétlése</h3>

      <pre class="bg-light p-3 rounded"><code>print("Python" * 3)</code></pre>

      <pre
        class="bg-dark text-light p-3 rounded"
      ><code>PythonPythonPython</code></pre>

      <h3 class="mt-4">Karakterek elérése</h3>

      <pre class="bg-light p-3 rounded"><code>print("Python"[0])
print("Python"[-1])</code></pre>

      <p>
        A számozás 0-tól kezdődik. A <code>-1</code> az utolsó karaktert
        jelenti.
      </p>

      <h3 class="mt-4">Kis- és nagybetűk</h3>

      <pre class="bg-light p-3 rounded"><code>print("Hello World!".lower())
print("Hello World!".upper())</code></pre>

      <h3 class="mt-4">Sztring hossza</h3>

      <pre class="bg-light p-3 rounded"><code>print(len("Python"))</code></pre>

      <p>A <code>len()</code> megadja, hány karakterből áll a sztring.</p>

      <!-- 3. SZÁMOK -->

      <h2 class="mt-5">3. Egész számok</h2>

      <p>Egész számokkal alapvető matematikai műveleteket végezhetünk.</p>

      <pre class="bg-light p-3 rounded"><code>print(10 + 5)
print(15 - 3)
print(2 * 6)
print(18 // 4)
print(7 % 3)</code></pre>

      <table class="table table-bordered mt-3">
        <thead>
          <tr>
            <th>Művelet</th>
            <th>Jelentés</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>+</td>
            <td>összeadás</td>
          </tr>
          <tr>
            <td>-</td>
            <td>kivonás</td>
          </tr>
          <tr>
            <td>*</td>
            <td>szorzás</td>
          </tr>
          <tr>
            <td>//</td>
            <td>egész osztás</td>
          </tr>
          <tr>
            <td>%</td>
            <td>maradékos osztás</td>
          </tr>
        </tbody>
      </table>

      <!-- 4. FLOAT -->

      <h2 class="mt-5">4. Lebegőpontos számok</h2>

      <p>A tizedes számokat Pythonban ponttal írjuk.</p>

      <pre class="bg-light p-3 rounded"><code>print(3.14 + 2.71)
print(5.5 - 1.1)
print(2.0 * 3.5)
print(7.2 / 3.6)
print(2 ** 3.0)</code></pre>

      <p>A <code>**</code> operátor hatványozást jelent.</p>

      <!-- 5. LOGIKAI ÉRTÉKEK -->

      <h2 class="mt-5">5. Logikai értékek</h2>

      <p>
        A Python két alapvető logikai értéket használ:
        <code>True</code> és <code>False</code>.
      </p>

      <pre class="bg-light p-3 rounded"><code>print(True and False)
print(True or False)
print(not True)</code></pre>

      <h3 class="mt-4">Összehasonlítások</h3>

      <pre class="bg-light p-3 rounded"><code>print(5 > 3)
print(2 == 2)
print(3 != 2)</code></pre>

      <table class="table table-bordered mt-3">
        <thead>
          <tr>
            <th>Operátor</th>
            <th>Jelentés</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>==</td>
            <td>egyenlő</td>
          </tr>
          <tr>
            <td>!=</td>
            <td>nem egyenlő</td>
          </tr>
          <tr>
            <td>&gt;</td>
            <td>nagyobb</td>
          </tr>
          <tr>
            <td>&lt;</td>
            <td>kisebb</td>
          </tr>
        </tbody>
      </table>

      <!-- 6. VÁLTOZÓK -->

      <h2 class="mt-5">6. Változók</h2>

      <p>A változók segítségével adatokat tárolhatunk.</p>

      <pre class="bg-light p-3 rounded"><code>kor = 25
nev = "Anna"
fizetes = 2500.75
aktiv = True</code></pre>

      <p>A változó típusa automatikusan az érték alapján alakul ki.</p>

      <h3 class="mt-4">Változók névadási szabályai</h3>

      <ul>
        <li>A változónév betűvel vagy aláhúzással kezdődhet.</li>
        <li>Nem kezdődhet számmal.</li>
        <li>Betűt, számot és aláhúzást tartalmazhat.</li>
        <li>A kis- és nagybetűk különböznek.</li>
        <li>Python kulcsszó nem használható változónévként.</li>
      </ul>

      <h3 class="mt-4">Helyes változónevek</h3>

      <pre class="bg-light p-3 rounded"><code>kor = 25
nev = "Anna"
felhasznalo1 = "John"
felhasznalo_vezeteknev = "Doe"
jelszo = "1234"</code></pre>

      <h3 class="mt-4">Hibás változónevek</h3>

      <pre class="bg-light p-3 rounded"><code># 1user = "John"
# user-name = "Doe"
# pass = "1234"</code></pre>

      <!-- 7. MŰVELETEK VÁLTOZÓKKAL -->

      <h2 class="mt-5">7. Műveletek változókkal</h2>

      <pre class="bg-light p-3 rounded"><code>nev = "Anna"
fizetes = 2500.75

eves_fizetes = fizetes * 12
koszones = "Szia, " + nev + "!"

print("Éves fizetés:", eves_fizetes)
print(koszones)</code></pre>

      <!-- 8. TÉGLALAP -->

      <h2 class="mt-5">8. Példa - Téglalap</h2>

      <pre class="bg-light p-3 rounded"><code>szelesseg = 5.0
magassag = 10.0

terulet = szelesseg * magassag
kerulet = 2 * (szelesseg + magassag)

print("Téglalap területe:", terulet, "négyzetméter")
print("Téglalap kerülete:", kerulet, "méter")</code></pre>

      <!-- 9. F-STRING -->

      <h2 class="mt-5">9. Formázott sztring - f-string</h2>

      <p>
        Az f-string segítségével változókat egyszerűen beilleszthetünk egy
        szövegbe.
      </p>

      <pre class="bg-light p-3 rounded"><code>nev = "László"
kor = 28
varos = "Budapest"

uzenet = f"{nev} {kor} éves, és {varos} városában él."

print(uzenet)</code></pre>

      <!-- 10. ÉRTÉKCSERE -->

      <h2 class="mt-5">10. Két változó értékének cseréje</h2>

      <pre class="bg-light p-3 rounded"><code>a = 10
b = 20

print("Csere előtt: a =", a, ", b =", b)

a, b = b, a

print("Csere után: a =", a, ", b =", b)</code></pre>

      <!-- 11. ÖSSZETETT PÉLDA -->

      <h2 class="mt-5">11. Példa - Termék adatainak tárolása</h2>

      <pre class="bg-light p-3 rounded"><code>termek_nev = "Laptop"
ar = 299999.99
keszlet_darab = 50
akcios = True

print("Termék neve:", termek_nev)
print("Ár:", ar, "Ft")
print("Raktáron lévő darabszám:", keszlet_darab)
print("Akciós termék:", akcios)</code></pre>

      <!-- 12. PRINT SEP END -->

      <h2 class="mt-5">12. A print() további lehetőségei</h2>

      <h3 class="mt-4">sep</h3>

      <p>
        A <code>sep</code> megadja, milyen karakter kerüljön a kiírt értékek
        közé.
      </p>

      <pre
        class="bg-light p-3 rounded"
      ><code>print("alma", "körte", "szilva", sep="#")</code></pre>

      <pre
        class="bg-dark text-light p-3 rounded"
      ><code>alma#körte#szilva</code></pre>

      <h3 class="mt-4">end</h3>

      <p>Az <code>end</code> megadja, mi történjen a kiírás végén.</p>

      <pre
        class="bg-light p-3 rounded"
      ><code>print("Ez az első sor", end="... ")
print("Ez a második sor")</code></pre>

      <h3 class="mt-4">sep és end együtt</h3>

      <pre
        class="bg-light p-3 rounded"
      ><code>print("python", "programozás", sep="-", end="!")</code></pre>

      <!-- GYAKORLÓ FELADATOK -->

      <h2 class="mt-5">13. Gyakorlófeladatok</h2>

      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">1. feladat - Három jegy átlaga</h3>

          <p>
            Hozz létre három változót három jegy tárolására, majd számítsd ki az
            átlagukat.
          </p>

          <pre class="bg-light p-3 rounded"><code>jegy1 = 4
jegy2 = 5
jegy3 = 3

atlag = (jegy1 + jegy2 + jegy3) / 3

print(f"A három jegy átlaga: {atlag}")</code></pre>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <h3 class="card-title">2. feladat - Termék adatainak kezelése</h3>

          <p>Írj programot, amely egy termék adatait változókban tárolja.</p>

          <p>Tárold az alábbi adatokat:</p>

          <ul>
            <li>a termék neve,</li>
            <li>ára forintban,</li>
            <li>raktáron lévő darabszám,</li>
            <li>akciós-e a termék.</li>
          </ul>

          <h4>Feladatok</h4>

          <ol>
            <li>Hozd létre a szükséges változókat.</li>
            <li>Írasd ki az összes adatot.</li>
            <li>Növeld meg az árat 10%-kal.</li>
            <li>Csökkentsd a készletet 3 darabbal.</li>
            <li>Írasd ki az új árat és az új készletet.</li>
          </ol>

          <p>Példa kiinduló adatok:</p>

          <pre class="bg-light p-3 rounded"><code>termek_nev = "Mobiltelefon"
ar = 99999
raktar_keszlet = 25
akcios = False</code></pre>
        </div>
      </div>

      <!-- MEGOLDÁS -->

      <h2 class="mt-5">14. A termékes feladat lehetséges megoldása</h2>

      <pre class="bg-light p-3 rounded"><code>termek_nev = "Mobiltelefon"
ar = 99999
raktar_keszlet = 25
akcios = False

print("Termék neve:", termek_nev)
print("Ár:", ar, "Ft")
print("Raktáron lévő darabszám:", raktar_keszlet)
print("Akciós:", akcios)

ar = ar * 1.10
raktar_keszlet = raktar_keszlet - 3

print("Új ár 10%-os növelés után:", ar, "Ft")
print("Új raktárkészlet:", raktar_keszlet, "darab")</code></pre>

      <!-- VISSZA -->

      <div class="d-grid gap-2 col-md-6 mx-auto mt-5">
        <a href="../index.html" class="btn btn-secondary btn-lg">Vissza </a>
      </div>
    </div>
  </body>
</html>
