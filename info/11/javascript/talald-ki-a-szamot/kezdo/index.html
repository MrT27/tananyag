<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Találd ki a számot!</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Találd ki a számot!</h1>
      <p class="between">(1 és 20 között)</p>
      <button type="button" class="btn again">Újra!</button>
      <div class="number">?</div>
    </header>
    <main>
      <section class="left">
        <input type="number" class="guess" aria-label="A tipped">
        <button type="button" class="btn check">Ellenőrzés!</button>
      </section>
      <section class="right">
        <p class="message">Kezdj el tippelni...</p>
        <p class="label-score">💯 Pontszám: <span class="score">20</span></p>
        <p class="label-highscore">🥇 Rekord: <span class="highscore">0</span></p>
      </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
