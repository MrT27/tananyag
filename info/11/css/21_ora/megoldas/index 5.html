<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid méretezés – megoldás</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 40px; }
  .container {
    display: grid;
    grid-template-columns: 2fr repeat(3, 1fr);
    grid-template-rows: 1fr auto;
    gap: 20px;
    max-width: 1000px;
    min-height: 420px;
    border: 2px dashed #777;
    padding: 10px;
  }
  .item { padding: 20px; font-size: 28px; font-weight: bold; background: #ddd; border: 2px solid #555; text-align:center; }
</style>
</head>
<body>
<h1>CSS Grid – rugalmas méretezés</h1>
<p>Az első oszlop kétszeres részt kap, a másik három egy-egy részt. A második sor csak annyi helyet foglal, amennyire szüksége van.</p>
<div class="container">
  <div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div>
  <div class="item">5</div><div class="item">6</div><div class="item">7</div><div class="item">8</div>
</div>
</body>
</html>
