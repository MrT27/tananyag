<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid – kezdő</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 40px; }
    .container {
      background: #ddd;
      font-size: 28px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 180px 120px;
      column-gap: 30px;
      row-gap: 60px;
    }
    .el { padding: 18px; }
    .el--1 { background: blueviolet; }
    .el--2 { background: orangered; }
    .el--3 { background: green; height: 150px; }
    .el--4 { background: goldenrod; }
    .el--5 { background: palevioletred; }
    .el--6 { background: steelblue; }
    .el--7 { background: yellow; }
    .el--8 { background: crimson; }
  </style>
</head>
<body>
  <h1>CSS Grid gyakorlás</h1>
  <div class="container">
    <div class="el el--1">1</div>
    <div class="el el--2">2</div>
    <div class="el el--3">3</div>
    <div class="el el--4">4</div>
    <div class="el el--5">5</div>
    <div class="el el--6">6</div>
    <div class="el el--7">7</div>
    <div class="el el--8">8</div>
  </div>
</body>
</html>
