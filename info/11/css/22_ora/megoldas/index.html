<!doctype html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grid elhelyezés – megoldás</title><style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;padding:32px;background:#f5f6f8}.container{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,140px);gap:20px}.item{display:grid;place-items:center;font-size:32px;font-weight:700;border:2px solid #333;border-radius:12px;background:white}.i1{background:#ffd6d6;grid-column:1 / 3}.i2{background:#d6e8ff;grid-column:4;grid-row:2}.i3{background:#dcf7dc}.i4{background:#fff1bf}.i5{background:#eadcff}.i6{background:#ffdff1;grid-row:1 / 3}.i7{background:#d9f7f4}.i8{background:#ececec;grid-column:2 / -1}
</style></head><body><div class="container"><div class="item i1">1</div><div class="item i2">2</div><div class="item i3">3</div><div class="item i4">4</div><div class="item i5">5</div><div class="item i6">6</div><div class="item i7">7</div><div class="item i8">8</div></div></body></html>
