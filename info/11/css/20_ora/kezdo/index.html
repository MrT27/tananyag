<!doctype html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid fogalmak – kezdő</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 40px; }
  .container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 120px 120px;
    gap: 10px;
    max-width: 800px;
  }
  .item { padding: 20px; font-size: 28px; font-weight: bold; background: #ddd; border: 2px solid #555; }
</style>
</head>
<body>
<h1>CSS Grid – fogalmak</h1>
<p>Vizsgáld meg a rácsot a böngésző fejlesztői eszközeivel!</p>
<div class="container">
  <div class="item">1</div><div class="item">2</div><div class="item">3</div>
  <div class="item">4</div><div class="item">5</div><div class="item">6</div>
</div>
</body>
</html>
